name: Dev Preview

on:
  push:
    branches: [dev]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy dev preview — index.html + JS files to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'EOF'
          const fs   = require('fs');
          const https = require('https');

          const TOKEN = process.env.GITHUB_TOKEN;
          const REPO  = 'DART-Skyboard/Autumn';

          function apiCall(method, path, body) {
            return new Promise((resolve, reject) => {
              const data = body ? JSON.stringify(body) : null;
              const req = https.request({
                hostname: 'api.github.com', path, method,
                headers: {
                  'Authorization': 'token ' + TOKEN,
                  'User-Agent': 'DevPreview/1.0',
                  'Accept': 'application/vnd.github.v3+json',
                  ...(data ? {'Content-Type':'application/json','Content-Length':Buffer.byteLength(data)} : {})
                }
              }, res => {
                let out = '';
                res.on('data', d => out += d);
                res.on('end', () => { try { resolve({status:res.statusCode,body:JSON.parse(out)}); } catch(e) { resolve({status:res.statusCode,body:out}); } });
              });
              req.on('error', reject);
              if (data) req.write(data);
              req.end();
            });
          }

          async function pushFile(srcPath, destPath, branch) {
            const content = Buffer.from(fs.readFileSync(srcPath)).toString('base64');
            const ts = new Date().toISOString().slice(0,16) + ' UTC';
            const existing = await apiCall('GET', '/repos/' + REPO + '/contents/' + destPath + '?ref=' + branch);
            const sha = existing.status === 200 ? existing.body.sha : null;
            const payload = { message: 'dev-preview: sync ' + destPath + ' @ ' + ts, content, branch };
            if (sha) payload.sha = sha;
            const result = await apiCall('PUT', '/repos/' + REPO + '/contents/' + destPath, payload);
            if (result.status === 200 || result.status === 201) {
              console.log('Synced:', destPath, '→', branch);
            } else {
              console.error('Failed:', destPath, result.status, JSON.stringify(result.body).slice(0,100));
            }
          }

          async function main() {
            // Copy index.html → autumn-dev.html on main
            await pushFile('index.html', 'autumn-dev.html', 'main');
            // Sync all changed JS files to main so autumn-dev.html can load them
            const jsFiles = fs.readdirSync('js').filter(f => f.endsWith('.js'));
            for (const f of jsFiles) {
              await pushFile('js/' + f, 'js/' + f, 'main');
            }
            console.log('Preview live at: https://leatr.xyz/autumn-dev.html');
          }
          main().catch(e => { console.error(e); process.exit(1); });
          EOF
