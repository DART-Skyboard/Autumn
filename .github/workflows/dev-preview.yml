name: Dev Preview

on:
  push:
    branches: [dev]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy dev preview to autumn-dev.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const fs = require('fs');
          const https = require('https');

          const TOKEN = process.env.GITHUB_TOKEN;
          const REPO  = 'DART-Skyboard/Autumn';
          const DEST  = 'autumn-dev.html';
          const BRANCH = 'main';

          function apiCall(method, path, body) {
            return new Promise((resolve, reject) => {
              const data = body ? JSON.stringify(body) : null;
              const req = https.request({
                hostname: 'api.github.com',
                path, method,
                headers: {
                  'Authorization': 'token ' + TOKEN,
                  'User-Agent': 'DevPreview/1.0',
                  'Accept': 'application/vnd.github.v3+json',
                  ...(data ? {'Content-Type':'application/json','Content-Length':Buffer.byteLength(data)} : {})
                }
              }, res => {
                let out = '';
                res.on('data', d => out += d);
                res.on('end', () => { try { resolve({status:res.statusCode,body:JSON.parse(out)}); } catch(e) { resolve({status:res.statusCode,body:out}); } });
              });
              req.on('error', reject);
              if (data) req.write(data);
              req.end();
            });
          }

          async function main() {
            const content = Buffer.from(fs.readFileSync('index.html')).toString('base64');
            const ts = new Date().toISOString().slice(0,16) + ' UTC';

            // Get existing SHA
            const existing = await apiCall('GET', '/repos/' + REPO + '/contents/' + DEST + '?ref=' + BRANCH);
            const sha = existing.status === 200 ? existing.body.sha : null;

            const payload = { message: 'dev-preview: sync from dev @ ' + ts, content, branch: BRANCH };
            if (sha) payload.sha = sha;

            const result = await apiCall('PUT', '/repos/' + REPO + '/contents/' + DEST, payload);
            if (result.status === 200 || result.status === 201) {
              console.log('Preview deployed: https://leatr.xyz/autumn-dev.html');
              console.log('Commit:', result.body.commit && result.body.commit.sha ? result.body.commit.sha.slice(0,10) : '?');
            } else {
              console.error('Deploy failed:', result.status, JSON.stringify(result.body).slice(0,200));
              process.exit(1);
            }
          }
          main().catch(e => { console.error(e); process.exit(1); });
          "
