name: Update Profile SVG

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Autumn
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and commit profile.svg
        env:
          LEATR_ASH_PAT: ${{ secrets.LEATR_ASH_PAT }}
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate_profile.js
